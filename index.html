<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Watch</title>
  <style>
    :root { color-scheme: light; --ink: #172126; --muted: #68757b; --paper: #f4f0e8; --panel: #fffdf8; --accent: #087f8c; --alert: #c84d36; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 85% 0%, #d6ece9 0, transparent 34rem), var(--paper); color: var(--ink); font: 16px/1.5 Georgia, serif; }
    main { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 48px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; border-bottom: 1px solid #c8d0cb; padding-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(2.6rem, 7vw, 5.5rem); line-height: .9; letter-spacing: 0; font-weight: 400; }
    .kicker { margin: 0 0 10px; color: var(--accent); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    .lede { max-width: 260px; margin: 0; color: var(--muted); font: 15px/1.5 Arial, sans-serif; }
    .workspace { display: grid; grid-template-columns: 280px 1fr; gap: 20px; margin-top: 26px; }
    section { background: var(--panel); border: 1px solid #d7ddd7; border-radius: 6px; padding: 22px; box-shadow: 0 12px 30px #33443b0d; }
    label { display: block; margin-bottom: 8px; color: var(--muted); font: 700 12px Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    output { display: block; margin: 8px 0 22px; color: var(--accent); font: 700 2rem Arial, sans-serif; }
    button { width: 100%; border: 0; border-radius: 4px; padding: 13px 16px; background: var(--accent); color: white; cursor: pointer; font: 700 14px Arial, sans-serif; }
    button:disabled { cursor: wait; opacity: .55; }
    .status { min-height: 48px; margin: 18px 0 0; color: var(--muted); font: 14px/1.45 Arial, sans-serif; }
    canvas { display: block; width: 100%; height: 300px; background: #132d32; border-radius: 3px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
    .metric span { display: block; color: var(--muted); font: 11px Arial, sans-serif; text-transform: uppercase; }
    .metric strong { display: block; margin-top: 3px; font: 700 1.25rem Arial, sans-serif; }
    .alert { color: var(--alert); }
    footer { margin-top: 18px; color: var(--muted); font: 12px Arial, sans-serif; }
    @media (max-width: 720px) { main { padding-top: 30px; } header { display: block; } .lede { margin-top: 18px; max-width: none; } .workspace { grid-template-columns: 1fr; } canvas { height: 220px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="kicker">Live audio instrument</p><h1>Signal<br>Watch</h1></div>
      <p class="lede">A private, in-browser microphone check for frequency and volume spikes.</p>
    </header>
    <div class="workspace">
      <section>
        <label for="sensitivity">Alert sensitivity</label>
        <input id="sensitivity" type="range" min="0.05" max="1" value="0.35" step="0.05">
        <output id="sensitivityValue">0.35</output>
        <button id="record" type="button">Start microphone</button>
        <p id="status" class="status">Allow microphone access, then record a short clip.</p>
        <footer>Audio is analyzed locally in your browser and is not uploaded.</footer>
      </section>
      <section>
        <canvas id="spectrum" width="900" height="300" aria-label="Frequency spectrum"></canvas>
        <div class="metrics">
          <div class="metric"><span>Dominant frequency</span><strong id="frequency">-- Hz</strong></div>
          <div class="metric"><span>Level</span><strong id="level">-- dBFS</strong></div>
          <div class="metric"><span>Signal score</span><strong id="score">-- / 100</strong></div>
        </div>
      </section>
    </div>
  </main>
  <script>
    const recordButton = document.querySelector('#record');
    const sensitivity = document.querySelector('#sensitivity');
    const sensitivityValue = document.querySelector('#sensitivityValue');
    const status = document.querySelector('#status');
    const canvas = document.querySelector('#spectrum');
    const context = canvas.getContext('2d');
    let stream;
    let audioContext;
    let analyser;

    sensitivity.addEventListener('input', () => { sensitivityValue.value = sensitivity.value; sensitivityValue.textContent = sensitivity.value; });
    function drawSpectrum(values) {
      context.fillStyle = '#132d32'; context.fillRect(0, 0, canvas.width, canvas.height);
      context.beginPath(); context.strokeStyle = '#62d2c4'; context.lineWidth = 2;
      values.forEach((value, index) => { const x = index / (values.length - 1) * canvas.width; const y = canvas.height - value / 255 * canvas.height; index ? context.lineTo(x, y) : context.moveTo(x, y); });
      context.stroke();
    }
    async function analyze() {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioContext = new AudioContext(); analyser = audioContext.createAnalyser(); analyser.fftSize = 4096;
      audioContext.createMediaStreamSource(stream).connect(analyser);
      const values = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(values); drawSpectrum(values);
      let peak = 1; for (let i = 2; i < values.length; i += 1) if (values[i] > values[peak]) peak = i;
      const frequency = peak * audioContext.sampleRate / analyser.fftSize;
      const waveform = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(waveform);
      const rms = Math.sqrt(waveform.reduce((sum, value) => sum + value * value, 0) / waveform.length);
      const decibels = 20 * Math.log10(Math.max(rms, 1e-6)); const score = Math.min(100, Math.max(0, 100 * rms / Number(sensitivity.value)));
      document.querySelector('#frequency').textContent = `${frequency.toFixed(1)} Hz`; document.querySelector('#level').textContent = `${decibels.toFixed(1)} dBFS`; document.querySelector('#score').textContent = `${score.toFixed(0)} / 100`;
      status.textContent = score >= 100 ? 'SPIKE ALERT: unusually loud signal' : 'Signal within the selected range'; status.className = score >= 100 ? 'status alert' : 'status';
      stream.getTracks().forEach(track => track.stop()); await audioContext.close(); recordButton.disabled = false; recordButton.textContent = 'Record again';
    }
    recordButton.addEventListener('click', async () => { recordButton.disabled = true; recordButton.textContent = 'Listening...'; status.textContent = 'Measuring a short microphone sample...'; try { await analyze(); } catch (error) { status.textContent = `Microphone unavailable: ${error.message}`; recordButton.disabled = false; recordButton.textContent = 'Try again'; } });
  </script>
</body>
</html>
