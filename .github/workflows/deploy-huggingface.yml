name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check required files
        run: test -f app.py && test -f requirements.txt && test -f README.md
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Import application
        run: python -c "import app; print('import ok')"
      - name: Compile Python
        run: python -m compileall -q app.py test_app.py
      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE || secrets.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN"
          test -n "$HF_SPACE"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" HEAD:main